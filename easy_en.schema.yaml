extended_mode:
  tag: extended_mode
  prefix: "``"
  suffix: ""
  alphabet: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/:`'"
  tips: "▸"

calculator:
  tag: calculator
  prefix: "cal="
  tips: "《計算機》▸"
  closing_tips: "◂《計算機》"
  alphabet: "0123456789+-*/().abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ,'"

