# Rime schema
# vim: set sw=2 sts=2 et:
# encoding: utf-8

schema:
  schema_id: easy_en
  name: Easy English
  version: "0.9.1"
  author:
    - Patrick <ipatrickmac@gmail.com>
    - BlindingDark <blindingdark@outlook.com>
  description:
    Easy English
  dependencies:
    - liur_symbols

easy_en:
  split_sentence: true
  use_wordninja_rs_lua_module: false
  wordninja_rs_lua_module_path: "/usr/lib/lua/5.4/wordninja.so"
  use_wordninja_rs: false
  wordninja_rs_path: "/usr/bin/wordninja"
  use_wordninja_py: false

switches:
  - name: ascii_mode
    reset: 0
    states: [ ASCII-OFF, ASCII-ON ]

engine:
  processors:
    - ascii_composer
    - lua_processor@liu_extended_backspace
    - lua_processor@liu_symbols_number_processor
    - lua_processor@liu_calculator_shortcut
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - matcher
    - ascii_segmentor
    - lua_segmentor@liu_extended_segmentor
    - affix_segmentor@extended_mode
    - affix_segmentor@symbols
    - affix_segmentor@calculator
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - lua_translator@liu_calculator
    - lua_translator@liu_symbols_hint
    - lua_translator@liu_letter_variants
    - lua_translator@liu_datetime
    - lua_translator@date_translator
    - table_translator@symbols
    - table_translator
    - punct_translator
  filters:
    - lua_filter@liu_extended_filter
    - lua_filter@liu_symbols_hint_filter
    - lua_filter@liu_english_case_filter
    - uniquifier
    - lua_filter@easy_en_enhance_filter

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  delimiter: " '"
  preedit_format:
  algebra:
    - derive/^.+$/\L$0/
    - derive/^.+$/\U$0/
    - derive/^./\U$0/

translator:
  dictionary: easy_en
  spelling_hints: 9
  comment_format:
    - xform/^.+$//

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    uppercase: ''
    extended_mode: "^``[a-zA-Z/0-9:`']*`?$"
    symbols: "^`([0-9]{0,2}|[a-z])`?$"
    calculator: "^cal=.*$"

symbols:
  tag: symbols
  dictionary: liur_symbols
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  prefix: "`"
  alphabet: "abcdefghijklmnopqrstuvwxyz`"
  tips: "《符號清單》▸"
  closing_tips: ""
  initial_quality: 1
  comment_format:
    - xform/^/~/

  preedit_format:
    - xform/^01/[01]一般/
    - xform/^02/[02]括號/
    - xform/^03/[03]引號/
    - xform/^04/[04]豎標/
    - xform/^05/[05]數學/
    - xform/^06/[06]單位/
    - xform/^07/[07]貨幣/
    - xform/^08/[08]分數/
    - xform/^09/[09]上標/
    - xform/^10/[10]下標/
    - xform/^11/[11]注音/
    - xform/^12/[12]拼音/
    - xform/^13/[13]音標/
